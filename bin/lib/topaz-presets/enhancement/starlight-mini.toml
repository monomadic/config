order = 10
category = "polish"
display = "Starlight Mini"
scales = ["1", "2", "4k"]
free_size = true
blurb = "Generative, local; the fast Starlight"
filter = 'tvai_up=model=slm-1:@SCALE@:device=0:vram=0.95:instances=1'
metadata = "videoai=[Polish] Starlight Mini. Diffusion-style reconstruction, the local Starlight. Runs through the ffmpeg tvai_up filter like everything else here; the app drives it as scale=0 with an explicit target size, and so does this row."

[insight]
strategy = "Diffusion-style reconstruction: it re-imagines pixels rather than filtering them, so it generates texture that Proteus can only sharpen toward. Three-part model (encoder, unet, decoder) that ffmpeg loads as one, with the medium set on a 48 GB Mac. When it wins it wins big."
watch = "A temporal model: the decoder works on 16-frame windows, so even a still preview reads a run of frames and takes a while to warm up before the first frame appears. It refuses immediately, rather than hanging, if any of its three parts is missing — run it once in the Topaz app to download them. Only ever rendered at an explicit size (scale=0:w:h), never scale=1/2, because that is the only form the app itself uses."
vs = "starlight-precise-26"
vs_note = "Precise is the stronger Starlight by a wide margin, at minutes per frame. Mini is the one you can afford to run on a whole clip."
