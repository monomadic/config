[insight]
strategy = "Rhea's only lever is Add Noise (0–0.1) — no detail or sharpen sliders, unlike Proteus. This sits near the top of that range, which is enough to break up the smooth, waxy patches a 4x upscale leaves behind without reading as film grain."
watch = "Grain lands after the model, so it never helps the reconstruction — it only disguises it. If the underlying 4x looks wrong, more grain will not save it."
vs = "rhea-xl"
vs_note = "Start with plain Rhea XL. Come here when the result looks technically right but too clean."
