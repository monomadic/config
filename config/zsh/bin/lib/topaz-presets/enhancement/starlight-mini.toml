[insight]
strategy = "Diffusion-style reconstruction: it re-imagines pixels rather than filtering them, so it generates texture that Proteus can only sharpen toward. When it wins it wins big, and it is worth reaching for — just not from here."
watch = "This row cannot render in mpv, and the preset will refuse immediately rather than hang. Starlight has no coreml backend: it is served by the app's separate neuroserver process, which the ffmpeg tvai_up filter cannot reach. Use the Topaz app for this one, or wait for a neuroserver backend here. Expect minutes per frame either way."
vs = "rhea-xl"
vs_note = "Rhea XL is the strongest thing this pipeline can actually run. Reach for Starlight in the app when Rhea is not enough."
