metadata = "videoai=[Polish] Artemis MQ Gentle. Fully automatic medium-quality Artemis — the classic safe default: mild denoise, mild sharpen, no sliders to misjudge. For footage that is basically fine and just needs polish."

[insight]
strategy = "Artemis has no manual sliders — it decides everything from the source, and errs gentle. That makes it the lowest-risk row here: it almost never makes footage worse, at the cost of never rescuing anything either."
watch = "If the source has a real defect — softness, heavy compression, noise — Artemis will politely ignore it. That is a cue to move to the matching repair group, not to stack Artemis harder."
vs = "proteus-detail-max"
vs_note = "Artemis polishes what exists; Detail Max invents. Preview Artemis first — if it already looks right, stop there."
