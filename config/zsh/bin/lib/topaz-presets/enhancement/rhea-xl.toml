[insight]
strategy = "Rhea folds Iris's face model into a Proteus-style enhancer, so faces survive a 4x upscale without needing the dedicated Iris row and its compressed-source bias. XL is the bigger, slower, higher-quality variant."
watch = "4x only — it never appears at Original or 2x resolution. Budget real render time; it is the most expensive model here that ffmpeg can actually run."
vs = "iris-faces"
vs_note = "Rhea for decent sources with people in frame; Iris only when the source itself is compressed junk."
