# My theme — only what differs from the shipped themes/default.toml;
# everything else keeps the built-in value. Reduced on 2026-10-17 (the
# dead `[help] veil/blur` and `[libs]` geometry keys were dropped: the
# app no longer reads them). Hot-reloads.

match = [0.9, 0.85, 0.05, 1.0]
match_glow = 0.25
match_ink = 1.0

[actors]
fill = [
  [1.0, 1.0, 1.0, 0.92],
]
size = [13.0, 13.0]

[backdrop.strip]
blur = 0.0

[badge]
size = 14.0
background = [0.0, 0.0, 0.0, 0.5]

[help]
radius = 24.0

[libs]
backdrop = [0.0, 0.0, 0.0, 0.9]

[quickview]
fade_ms = 0.0
title_size = 22.0

[quickview.padding]
x = 0.03

[rating]
hover = [1.0, 0.831, 0.373, 0.55]

[search.row]
actors_size = 10.0

[seekbar]
fade_ms = 150.0
height = 10.0
track = [1.0, 1.0, 1.0, 0.0]
ghost = [1.0, 1.0, 1.0, 0.16]
bottom_pad = 48.0
row_gap = 8.0
details_size = 12.0
background = [0.0, 0.0, 0.0, 0.55]
background_pad = 0.5

[seekbar.knob]
scale = 1.32
swell = 1.16
background = [0.0, 0.0, 0.0, 0.0]
background_pad = 1.0

[sort]
padding = 20

[sort.border]
color = [1.0, 0.0, 0.0, 0.052]

[strip]
height = 96.0
gap = 4.0

[strip.focused]
scale = 1.36

[strip.selected]
scale = 1.36

[tags]
fill = [
  [0.0, 0.7, 0.2, 1.0],
  [1.0, 0.065, 0.922, 1.0],
  [0.0, 0.157, 0.859, 1.0],
  [1.0, 0.235, 0.804, 1.0],
]
size = [14.0, 14.0]

[tags.popup]
pad_x = 14.0
pad_y = 3.5

[tile.selected]
scale = 1.0
zoom_boost = 0.0

[tile.focused.border]
width = 1.0
color = [1.0, 1.0, 1.0]

[triple]
radius = 20.0

[window]
background = [0.0, 0.0, 0.0, 0.6]
