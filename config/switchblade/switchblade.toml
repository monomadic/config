# ══ Tables added from the repo defaults, 2026-09-03 ══════════════════

# ── Keys & commands (DESIGN.md §11) ────────────────────────────────────────
# Every key is remappable, movement included: hjkl and the arrows bind to
# the context-sensitive `move_left`/`move_down`/`move_up`/`move_right`
# actions by default — in the grid and quickview they move the selection,
# in fullview (chapter bar up or not) left/right step the playing clip
# between chapters (real chapters, or the synthesized checkpoints the
# chapter bar shows) instead. The plain `next`/`prev` actions remain for
# bindings that should always move the selection (auto-skip fires `next`).
# Built-in defaults: enter/o = exec (play in mpv) · space = quickview ·
# tab = fullview · c = copy_path · q = quit · f = fullscreen ·
# n / p (and . / ,) = next / prev clip · P = toggle_focus_pause ·
# 3 = triple play · r = reveal · -/=/0 = zoom · [ / ] = skip
# back/fwd through the playing clip · / = search · # = hashtags popup ·
# ? = keybindings help panel · D = browse the selected clip's
# parent dir · R = reload the selected clip (re-stat it, re-check the
# cache, re-read its metadata — for a file that changed on disk under a
# running session). Entries here override them.
#
# A binding is a command name, optionally followed by an inline argument
# in quotes — one shape for everything:
#   "1" = "open '~/Movies/Prawns/'"                        # swap the library
#   "a" = "exec 'cat ~/Movies/.index | sb --fast-fullscreen'"   # run a command
#
# A key can name an internal action (quit, fullscreen, fast_fullscreen,
# copy_path, quickview, fullview, chapter_mode, triple_play,
# toggle_focus_pause, zoom_in, zoom_out, zoom_reset, move_left,
# move_right, move_up, move_down, next, prev, skip_forward, skip_back,
# open_parent, open (swap the library, needs a path), reload, jump_random,
# shuffle_library, toggle_auto_skip, tag_popup, search) or any
# [commands.*] entry below. In
# commands, {path}, {dir} and {name} expand against the selected clip.
#
# Several keys may share one action — the arrows ship bound to the same
# move_* actions as hjkl, and you can point more keys at anything.
#
# `open` swaps the whole library to a directory named inline (a leading ~
# expands, quote paths with spaces); it walks subfolders when `recurse`
# is on, just like passing the dir on the command line. Handy for one-key
# "library" switches ("open_library"/"open_dir"/"library" alias it):
#   "1" = "open '~/Movies/Prawns/'"
#   "2" = "open '/Volumes/Prawns/Movies/'"
#
# `exec '<command line>'` runs a command line the way you'd type it in a
# terminal — pipes, flags, redirects and all — so one key can launch a
# whole other library, a player with your own flags, or a script:
#   "a" = "exec 'cat /Volumes/Tower/Movies/.index | sb --fast-fullscreen'"
#   "v" = "exec 'mpv --loop-file=inf {path}'"
#   "n" = "exec '~/bin/rename-media {path}'"
# It runs in /bin/sh with nothing selected too (handy for the library
# launchers above), and {path}/{dir}/{name} come out quoted, so spaces in
# a filename never split into two arguments — write {path}, not "{path}".
# ("run"/"sh"/"shell" alias exec; a bare `exec` runs [commands.exec].)
#
# fullscreen = macOS native (the window animates into its own Space);
# fast_fullscreen = mpv-style: a borderless window covering the screen —
# instant, and you stay on the current Space. Either exits whichever
# fullscreen mode is active, so bind one or both:
# f = "fast_fullscreen"
# The --fullscreen / --fast-fullscreen CLI flags start the app that way.

# ── Gamepad feel ────────────────────────────────────────────────────────
# A stick is a RATE control, not a key: how far you push it sets how fast
# the selection walks. Each pair below is [at the engage threshold, at
# full deflection] — a light lean gets the first number, burying the
# stick gets the second, and anything between is interpolated. Set a
# pair to the same value on both ends for one fixed rate, keyboard-style.
# All hot-reload: edit, save, feel the difference without restarting.
