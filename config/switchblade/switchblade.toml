# Switchblade config — migrated to the per-table layout on 2026-10-17.
# Only values that differ from the defaults are written; the full
# reference is `switchblade --init-full`. Hot-reloads, except [startup].

theme = "default"

[grid]
tile_width = 100.0
tile_height = 100.0
fade_in_ms = 0.0
thumb_fade_ms = 0

[scroll]
pan_sensitivity = 2.0
strip_selects = false

[zoom]
pinch_sensitivity = 0.5
model = "strip"

[live]
delay_ms = 50.0
hover_delay_ms = 50.0

[seek]
min_s = 10.0

[library]
libraries = [
  { name = "Latest (Local)", exec = "fd-media --sort-created ~/Movies/Porn" },
  { name = "External", path = "/Volumes/*/Movies/Porn" },
  { name = "Tower", path = "/Volumes/Tower/Movies/Porn" },
  { name = "Visuals (External)", path = "/Volumes/*/Movies/Visuals" },
  { name = "Private (Local)", path = "~/Movies/Private" },
  { name = "fd", exec = "fd-media" },
  { name = "Private Sorted Safe", exec = "fd-media --sort-created --match-string Alice . ~/Movies/Private /Volumes/*/Movies/Private" },
  "/Volumes/*/Movies/Porn",
  "~/Movies/Private",
  "~/Movies/Porn",
  "~/Movies/Porn/Downloads",
]
ignore = [".*", "_*", "*_.*"]

[startup]
thumb_width = 360
thumb_seek_fraction = 0.05
fullscreen = true
thumb_quality = 8
atlas_memory_mb = 860
video_max_width = 3840
video_max_height = 2160
max_videos = 9

[pad]
haptics = false
dpad_repeat_delay_ms = 10.0
curve = 2.5

# Keys the old config carried that the app no longer reads (they were dead
# there too):
# chapter_snap, tile_badge, tile_badge_size, tile_badge_inset_x, tile_badge_inset_y, tile_badge_min_w, tile_badge_fill, tile_badge_gap, tile_badge_text, tile_badge_layout, tile_badge_rise, tile_badge_stagger, tile_badge_mark_radius, tile_badge_mark_pad_x, tile_badge_mark_pad_y, tile_badge_star_radius, tile_badge_star_pad_x, tile_badge_star_pad_y, tile_badge_time_radius, tile_badge_time_pad_x, tile_badge_time_pad_y, tile_badge_mark_border, tile_badge_mark_inset, filter_veil_steps, marked_dim
