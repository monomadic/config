# Quick-access terminal (kitty 0.42+): a Quake-style drop-down kitty window.
#
# Launch/toggle with:   kitten quick-access-terminal
#
# To get a system-wide hotkey on macOS, run it once so the window appears, then
# close it, and assign a shortcut in:
#   System Settings > Keyboard > Keyboard Shortcuts > Services > General
#   -> "Quick access to kitty"
#
# This is a different shape to the in-window REPL overlay bound to
# kitty_mod+shift+enter (kittens/toggle_repl.py) -- that one splits the current
# kitty window, this one floats above every app.

edge top
lines 22
columns 160

background_opacity 0.9
hide_on_focus_loss yes

# Keep the drop-down visually distinct from a normal kitty window.
kitty_override hide_window_decorations=yes
kitty_override window_padding_width=8
