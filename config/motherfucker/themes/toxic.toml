# motherfucker theme: Toxic — near-black, radioactive neon green, a
# warning-yellow hit on the selection.
[style]
panel_background = "#050805"
panel_opacity = 0.94
panel_foreground = "#D8FFD0"
item_foreground = "#B8E6B0"
selected_item_foreground = "#39FF14"  # neon green
item_foreground_highlight = "#39FF14"
selected_item_foreground_highlight = "#F5FF00"  # warning yellow
icon_foreground = "#39FF14"
selected_item_background = "#0F2A0C"
selected_item_opacity = 0.95
selected_item_border = "#39FF14"
selected_item_border_width = 1
item_info_foreground = "#39FF14"
item_info_background = "#0C1A0A"
running_dot = "#F5FF00"
cpu_alert = "#FF3D00"
cpu_alert_background = "#2A0C04"
border_width = 1
border = "#143D10"
scanlines = 0.4  # soft CRT scanlines, 0 = off
crt = 0.5  # phosphor glow and vignette, 0 = off
