[[language]]
name = "rust"
auto-format = true
indent = { tab-width = 2, unit = "\t" }
roots = ["Cargo.toml"]

[[language]]
name = "typescript"
auto-format = true
indent = { tab-width = 2, unit = "\t" }

[[language]]
name = "toml"
auto-format = true

[[language]]
name = "json"
auto-format = true

[[language]]
name = "solidity"
auto-format = true
indent = { tab-width = 2, unit = "\t" }

[[language]]
name = "xml"
file-types = ["xml", "svg", "xsd", "xslt", "xsl"]
auto-format = true
formatter = { command = "xmllint", args = ["--format", "-"] }
language-servers = ["xml"]

[[language]]
name = "markdown"
language-servers = ["marksman"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }
soft-wrap.enable = true

[[language]]
name = "bash"
language-servers = ["bashls"]

[[language]]
name = "toml"
language-servers = ["tombi"]
auto-format = true

[language-server.bashls]
command = "bashls"

[language-server.tombi]
command = "tombi"

[language-server.xml]
command = "lemminx-osx-aarch_64"

# The repo's Deployfile (read by scripts/setup/link.zsh). It has no grammar of
# its own; bash's is close enough to colour verbs, paths and comments.
[[language]]
name = "deployfile"
scope = "source.deployfile"
file-types = [{ glob = "Deployfile" }]
comment-token = "#"
grammar = "bash"
