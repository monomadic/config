# The jobs toolchain: job-folder, the queue and its menu bar in one process,
# and job-core, the menu rows and the icon it draws.
#
# The objc2 family has to agree across members: job-core hands NSImage and
# NSView across the crate boundary, so a version skew would be a type error
# rather than a warning. Pinning them here is what makes that structural.

[workspace]
resolver = "3"
members = ["job-core", "job-folder"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
job-core = { path = "job-core" }
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"

# Profiles are workspace-root only; a [profile] in a member is ignored.
[profile.release]
opt-level = "s"
lto = true
strip = true
