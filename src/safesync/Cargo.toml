[package]
name = "safesync"
version = "0.1.0"
edition = "2024"
description = "Indexed one-way media sync between sentinel-marked drives, with offline lookup"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
lto = true
strip = true
