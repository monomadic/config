[package]
name = "tagform"
version = "0.1.0"
edition = "2021"
description = "A form-based metadata tagger for MP4/MOV"
license = "MIT"

[[bin]]
name = "tagform"
path = "src/main.rs"

[dependencies]
ratatui       = "0.30"
crossterm     = "0.29"
ratatui-image = "11"
tui-input     = "0.15"
ratatui-textarea = "0.9"
url           = "2"
unicode-width = "0.2"
image         = "0.25"
anyhow        = "1.0"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm     = { version = "0.29", features = ["use-dev-tty"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
