[package]
name = "tagform"
version = "0.1.0"
edition = "2021"
description = "A form-based metadata tagger for MP4/MOV"
license = "MIT"

[[bin]]
name = "tagform"
path = "src/main.rs"

[dependencies]
anyhow        = "1.0"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
