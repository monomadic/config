# tagform — user-defined QuickTime Keys tags.
#
# Required runtime asset, passed as `exiftool -config` on every invocation.
# Without it exiftool refuses this repo's custom mdta keys:
#
#     Warning: Sorry, Keys:Actors doesn't exist or isn't writable
#
# which is the wall rename-footage hit before it retreated to XMP. With it, all
# of these round-trip through ffprobe with the standard keys untouched.
# See docs/CONTAINER.md §3.1.

%Image::ExifTool::UserDefined = (
    'Image::ExifTool::QuickTime::Keys' => {
        actors       => { Name => 'Actors',      Writable => 'string' },
        channel      => { Name => 'Channel',     Writable => 'string' },
        type         => { Name => 'Type',        Writable => 'string' },
        rating       => { Name => 'RatingStars', Writable => 'string' },
        origin       => { Name => 'Origin',      Writable => 'string' },
        location     => { Name => 'Location',    Writable => 'string' },
        source_url   => { Name => 'SourceUrl',   Writable => 'string' },
        webpage_url  => { Name => 'WebpageUrl',  Writable => 'string' },
        original_url => { Name => 'OriginalUrl', Writable => 'string' },
    },
);

1;  #end
