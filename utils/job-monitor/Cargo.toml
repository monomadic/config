[package]
name = "job-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
job-core = { path = "../job-core" }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSStatusBar", "NSStatusItem", "NSMenu", "NSMenuItem", "NSImage", "NSBezierPath", "NSColor", "NSCell", "NSButton", "NSControl", "NSResponder", "NSView", "NSGraphics", "NSWorkspace", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSTimer", "NSObject", "NSGeometry", "NSDate", "NSDateFormatter", "NSThread", "NSError", "NSBundle", "NSArray", "NSDictionary"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSound", "block2"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
