[package]
name = "safesync"
version = "0.1.0"
edition = "2024"
description = "Portable drive manifests and honest offline content lookup for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
