[package]
name = "topaz-select-preset"
version = "0.1.0"
edition = "2021"
description = "TUI: pick a Topaz ffmpeg preset (enhancement, resolution, interpolation, output), step through its rendered preview window as kitty images, encode with topaz-encode while watching the newest frame"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = "12.0.0-rc.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = "1.0"

[profile.release]
lto = true
strip = true
