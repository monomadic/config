[package]
name = "battery-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSStatusBar", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSFont", "NSColor", "NSResponder", "NSButton", "NSControl", "NSView", "NSRunningApplication", "NSGraphics", "NSAttributedString", "NSCell", "NSFontDescriptor", "NSImage", "NSBezierPath", "NSStringDrawing", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSAttributedString", "NSString", "NSDictionary", "NSTimer", "NSThread", "NSDate", "NSObject", "NSRunLoop", "NSGeometry", "NSUserDefaults", "NSValue", "NSEnumerator"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
